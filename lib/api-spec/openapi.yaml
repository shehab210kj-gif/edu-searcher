openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Academic research projects
  - name: ai
    description: AI-powered operations
  - name: templates
    description: Formatting templates library
  - name: stats
    description: Dashboard statistics
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: library
    description: Academic research library (master templates and previous research)
  - name: admin
    description: Password-gated library administration
  - name: versions
    description: Document version history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/analyze:
    post:
      operationId: analyzeProject
      tags: [ai]
      summary: AI analysis - detect type, build structured sections
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Analyzed project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/references:
    post:
      operationId: extractReferences
      tags: [ai]
      summary: Extract and format references per citation style
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project with references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/verify:
    post:
      operationId: verifyProject
      tags: [ai]
      summary: Academic verification + readiness score
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project with verification results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/assist:
    post:
      operationId: assistProject
      tags: [ai]
      summary: AI academic assistant actions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistInput"
      responses:
        "200":
          description: Assistant result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List formatting templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          $ref: "#/components/responses/NotFound"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /library:
    get:
      operationId: listLibraryDocuments
      tags: [library]
      summary: Browse the research library with filters
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: documentType, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: university, in: query, required: false, schema: { type: string } }
        - { name: degreeLevel, in: query, required: false, schema: { type: string } }
        - { name: department, in: query, required: false, schema: { type: string } }
        - { name: language, in: query, required: false, schema: { type: string } }
        - { name: tag, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Matching library documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryListResponse"

  /library/facets:
    get:
      operationId: getLibraryFacets
      tags: [library]
      summary: Distinct filter values with counts
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryFacets"

  /library/categories:
    get:
      operationId: listLibraryCategories
      tags: [library]
      summary: Admin-managed taxonomy for filters
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryCategory"

  /library/{id}:
    get:
      operationId: getLibraryDocument
      tags: [library]
      summary: Get a full library document (with rich content) for preview
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Library document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryDocument"
        "404":
          $ref: "#/components/responses/NotFound"

  /library/{id}/use:
    post:
      operationId: useLibraryDocument
      tags: [library]
      summary: Duplicate a library document into a private editable project copy
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: Created editable copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Validate the admin password and return a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLogin"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/library:
    get:
      operationId: listAdminLibrary
      tags: [admin]
      summary: List all library documents (including drafts) for administration
      responses:
        "200":
          description: All library documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/library/{id}:
    patch:
      operationId: updateLibraryDocument
      tags: [admin]
      summary: Update library document metadata or content
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryDocumentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteLibraryDocument
      tags: [admin]
      summary: Delete a library document
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/categories:
    post:
      operationId: createLibraryCategory
      tags: [admin]
      summary: Create a taxonomy entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/categories/{id}:
    delete:
      operationId: deleteLibraryCategory
      tags: [admin]
      summary: Delete a taxonomy entry
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/versions:
    get:
      operationId: listProjectVersions
      tags: [versions]
      summary: List version history for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentVersion"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectVersion
      tags: [versions]
      summary: Snapshot the current project state as a new version
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVersionInput"
      responses:
        "201":
          description: Created version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{id}/versions/{versionId}/restore:
    post:
      operationId: restoreProjectVersion
      tags: [versions]
      summary: Restore a project to a previous version snapshot
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Admin authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Formatting:
      type: object
      properties:
        fontFamily: { type: string }
        fontSize: { type: number }
        headingSize: { type: number }
        subheadingSize: { type: number }
        lineSpacing: { type: number }
        pageSize: { type: string }
        marginTop: { type: number }
        marginBottom: { type: number }
        marginLeft: { type: number }
        marginRight: { type: number }
        paragraphAlign: { type: string }
        firstLineIndent: { type: number }
      required:
        - fontFamily
        - fontSize
        - headingSize
        - subheadingSize
        - lineSpacing
        - pageSize
        - marginTop
        - marginBottom
        - marginLeft
        - marginRight
        - paragraphAlign
        - firstLineIndent

    Section:
      type: object
      properties:
        key: { type: string }
        heading: { type: string }
        content: { type: string }
      required: [key, heading, content]

    Reference:
      type: object
      properties:
        id: { type: string }
        raw: { type: string }
        formatted: { type: string }
        type: { type: string }
        authors: { type: string }
        year: { type: string }
        title: { type: string }
        source: { type: string }
        inTextCitation: { type: string }
      required: [id, formatted]

    VerificationIssue:
      type: object
      properties:
        type: { type: string }
        severity: { type: string }
        message: { type: string }
        location: { type: ["string", "null"] }
        suggestion: { type: ["string", "null"] }
      required: [type, severity, message]

    Verification:
      type: object
      properties:
        readinessScore: { type: integer }
        completeness: { type: integer }
        citations: { type: integer }
        indexing: { type: integer }
        formatting: { type: integer }
        issues:
          type: array
          items:
            $ref: "#/components/schemas/VerificationIssue"
      required: [readinessScore, completeness, citations, indexing, formatting, issues]

    Analysis:
      type: object
      properties:
        researchType: { type: string }
        pageCount: { type: integer }
        language: { type: string }
        specialization: { type: string }
        summary: { type: string }
        detectedSections:
          type: array
          items: { type: string }
      required: [researchType, pageCount, language, specialization, summary, detectedSections]

    ProjectSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        workType: { type: string }
        citationStyle: { type: string }
        language: { type: string }
        readinessScore: { type: ["integer", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, title, workType, citationStyle, language, createdAt, updatedAt]

    Project:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        workType: { type: string }
        citationStyle: { type: string }
        language: { type: string }
        templateId: { type: ["integer", "null"] }
        rawContent: { type: string }
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
        references:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        formatting:
          $ref: "#/components/schemas/Formatting"
        analysis:
          oneOf:
            - $ref: "#/components/schemas/Analysis"
            - type: "null"
        verification:
          oneOf:
            - $ref: "#/components/schemas/Verification"
            - type: "null"
        readinessScore: { type: ["integer", "null"] }
        sourceLibraryDocumentId: { type: ["integer", "null"] }
        richContent: { type: ["string", "null"] }
        layoutMetadata:
          oneOf:
            - $ref: "#/components/schemas/LayoutMetadata"
            - type: "null"
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - title
        - workType
        - citationStyle
        - language
        - rawContent
        - sections
        - references
        - formatting
        - createdAt
        - updatedAt

    ProjectInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        workType: { type: string }
        citationStyle: { type: string }
        language: { type: string }
        templateId: { type: ["integer", "null"] }
        rawContent: { type: string }
      required: [title, workType, citationStyle, language]

    ProjectUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        workType: { type: string }
        citationStyle: { type: string }
        language: { type: string }
        templateId: { type: ["integer", "null"] }
        rawContent: { type: string }
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
        references:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        formatting:
          $ref: "#/components/schemas/Formatting"
        richContent: { type: ["string", "null"] }
        layoutMetadata:
          oneOf:
            - $ref: "#/components/schemas/LayoutMetadata"
            - type: "null"

    AssistInput:
      type: object
      properties:
        action: { type: string }
        instructions: { type: string }
        context: { type: string }
      required: [action]

    AssistResult:
      type: object
      properties:
        result: { type: string }
        suggestions:
          type: array
          items: { type: string }
      required: [result]

    Template:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        citationStyle: { type: string }
        isBuiltin: { type: boolean }
        formatting:
          $ref: "#/components/schemas/Formatting"
        createdAt: { type: string }
      required: [id, name, category, citationStyle, isBuiltin, formatting, createdAt]

    Stats:
      type: object
      properties:
        totalProjects: { type: integer }
        avgReadiness: { type: integer }
        completedProjects: { type: integer }
        byWorkType:
          type: array
          items:
            $ref: "#/components/schemas/WorkTypeCount"
        recentProjects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
      required: [totalProjects, avgReadiness, completedProjects, byWorkType, recentProjects]

    WorkTypeCount:
      type: object
      properties:
        workType: { type: string }
        count: { type: integer }
      required: [workType, count]

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }

    PageSetup:
      type: object
      properties:
        size: { type: string }
        orientation: { type: string, enum: [portrait, landscape] }
        marginTop: { type: number }
        marginBottom: { type: number }
        marginLeft: { type: number }
        marginRight: { type: number }

    CoverFields:
      type: object
      properties:
        title: { type: string }
        subtitle: { type: string }
        studentName: { type: string }
        supervisor: { type: string }
        university: { type: string }
        faculty: { type: string }
        department: { type: string }
        degree: { type: string }
        year: { type: string }
        logoUrl: { type: string }

    LayoutMetadata:
      type: object
      properties:
        coverPageHtml: { type: string }
        headerHtml: { type: string }
        footerHtml: { type: string }
        showPageNumbers: { type: boolean }
        pageNumberFormat: { type: string }
        pageNumberAlign: { type: string, enum: [left, center, right] }
        pageSetup:
          $ref: "#/components/schemas/PageSetup"
        cover:
          $ref: "#/components/schemas/CoverFields"

    LibraryDocument:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        documentType: { type: string }
        coverImageUrl: { type: ["string", "null"] }
        university: { type: ["string", "null"] }
        degreeLevel: { type: ["string", "null"] }
        department: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        language: { type: string }
        tags:
          type: array
          items: { type: string }
        originalFileName: { type: ["string", "null"] }
        originalFileUrl: { type: ["string", "null"] }
        richContent: { type: string }
        layoutMetadata:
          $ref: "#/components/schemas/LayoutMetadata"
        formatting:
          oneOf:
            - $ref: "#/components/schemas/Formatting"
            - type: "null"
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - title
        - description
        - documentType
        - language
        - tags
        - richContent
        - layoutMetadata
        - status
        - createdAt
        - updatedAt

    LibraryDocumentSummary:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        documentType: { type: string }
        coverImageUrl: { type: ["string", "null"] }
        university: { type: ["string", "null"] }
        degreeLevel: { type: ["string", "null"] }
        department: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        language: { type: string }
